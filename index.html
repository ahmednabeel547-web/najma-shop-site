<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر نجمة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="land">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff"/><path d="M50 16l9.5 21 23 2.5-17 15.5 5 22.5L50 65 29.5 77.5l5-22.5-17-15.5 23-2.5z" fill="#b5527f"/></svg>
  <h1>متجر نجمة</h1>
  <div>موبايلات • سماعات • كفرات • لواصق • كيبلات • شواحن</div>
  <button onclick="enter('cust')">الدخول كزبون</button>
  <button class="o" onclick="this.style.display='none';document.getElementById('lf').style.display='flex'">الدخول كمالك</button>
  <div id="lf">
    <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
    <input id="pw" type="password" placeholder="كلمة السر" dir="ltr">
    <button onclick="ownerLogin()">دخول</button>
  </div>
  <div id="err"></div>
</div>
<div id="app">
  <header><h1>متجر نجمة</h1><div>موبايلات • سماعات • كفرات • لواصق • كيبلات • شواحن</div></header>
  <div class="bar"><b>وضع الإدارة</b><button onclick="addSec()">+ قسم</button><button class="gray" onclick="logout()">خروج</button></div>
  <div class="top"><input id="q" type="search" placeholder="ابحث عن منتج..." oninput="render()"><button class="gray" id="cu" onclick="logout()">خروج</button></div>
  <nav id="nav"></nav>
  <div id="main"></div>
  <footer>© متجر نجمة</footer>
  <button id="fab" onclick="openCart()">🛒 العربة (<span id="cnt">0</span>)</button>
</div>
<div id="cart" onclick="if(event.target===this)this.style.display='none'"><div id="cbox"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
